<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>42 Events</title>

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/events.css"
    >
</head>

<body class="events-page">

<main class="events-container">

    <header class="events-header">

        <span class="events-number">
            05
        </span>

        <h1>
            42 Events
        </h1>

    </header>


    <section class="events-grid">

        <!-- CODE RELAY -->

        <a
            href="/events/code-relay/"
            class="event-card"
        >

            <div
                class="event-image code-relay-image"
            ></div>


            <div class="event-content">

                <div class="event-top">

                    <span class="event-type">
                        PROGRAMMING
                    </span>

                    <span class="event-location">
                        42 BELGIUM
                    </span>

                </div>


                <h2>
                    Code Relay
                </h2>


                <div class="event-tags">

                    <span>C</span>
                    <span>Python</span>
                    <span>Flask</span>
                    <span>Bash</span>

                </div>


                <div class="event-link">
                    Open event →
                </div>

            </div>

        </a>


        <!-- BLIND TEST -->

        <a
            href="/events/blindtest/"
            class="event-card"
        >

            <div
                class="event-image blindtest-image"
            ></div>


            <div class="event-content">

                <div class="event-top">

                    <span class="event-type">
                        GAME
                    </span>

                    <span class="event-location">
                        42 BELGIUM
                    </span>

                </div>


                <h2>
                    Blind Test
                </h2>


                <div class="event-tags">

                    <span>Unity</span>
                    <span>C#</span>

                </div>


                <div class="event-link">
                    Open event →
                </div>

            </div>

        </a>

    </section>

</main>

</body>

</html>
