<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aurore Rakoto</title>

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/home.css"
    >
</head>

<body>

<main class="home">

    <div class="overlay"></div>


    <!-- LANGUAGE SELECTOR -->

    <div class="language-selector">

        <button
            class="language-button"
            id="current-language"
        >
            🇬🇧 EN
        </button>


        <div class="language-menu">

            <button data-lang="en">
                🇬🇧 EN
            </button>

            <button data-lang="fr">
                🇫🇷 FR
            </button>

            <button data-lang="jp">
                🇯🇵 JP
            </button>

            <button data-lang="kr">
                🇰🇷 KR
            </button>

        </div>

    </div>


    <!-- MAIN MENU -->

    <section class="menu">

        <a
            class="menu-item"
            href="/projects/"
            data-bg="projects"
        >
            <span>01</span>

            <h2 data-i18n="projects">
                Projects
            </h2>
        </a>


        <a
            class="menu-item"
            href="/education/"
            data-bg="education"
        >
            <span>02</span>

            <h2 data-i18n="education">
                Education
            </h2>
        </a>


        <a
            class="menu-item"
            href="/journey/"
            data-bg="journey"
        >
            <span>03</span>

            <h2 data-i18n="journey">
                Journey
            </h2>
        </a>


        <a
            class="menu-item"
            href="/experience/"
            data-bg="experience"
        >
            <span>04</span>

            <h2 data-i18n="experience">
                Experience
            </h2>
        </a>


        <a
            class="menu-item"
            href="/events/"
            data-bg="events"
        >
            <span>05</span>

            <h2 data-i18n="events">
                42 Events
            </h2>
        </a>


        <div
            class="menu-item locked"
            data-bg="personal"
        >
            <span>06</span>

            <h2 data-i18n="personal">
                Personal 🔒
            </h2>
        </div>

    </section>


    <!-- FOOTER -->

    <footer class="bottom-nav">

        <div class="bottom-line"></div>

        <div class="bottom-content">

            <nav>

                <a
                    href="/about/"
                    data-i18n="about"
                >
                    About
                </a>

                <a
                    href="/contact/"
                    data-i18n="contact"
                >
                    Contact
                </a>

                <a
                    href="/assets/cv.pdf"
                    target="_blank"
                >
                    CV
                </a>

            </nav>


            <div class="socials">

                <a
                    href="https://github.com/auroreRakoto"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    LinkedIn
                </a>

            </div>

        </div>

    </footer>

</main>


<script src="/js/translations.js"></script>
<script src="/js/main.js"></script>

</body>

</html>
